<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ponte en contacto con TechStore para soporte técnico o consultas sobre pedidos.">
    <meta name="author" content="Tu Nombre">
    <title>TechStore - Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">PC<span>Chatarra</span></div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Página Principal</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="sobre.html">Sobre Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <h1>Contacto</h1>
            <p style="margin-bottom: 20px;">¿Tienes dudas sobre algún componente o necesitas soporte técnico? Escríbenos.</p>
            
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" placeholder="¿En qué podemos ayudarte?" required></textarea>
                </div>

                <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Enviar Mensaje</button>
            </form>
        </div>
    </main>


</body>
</html>
